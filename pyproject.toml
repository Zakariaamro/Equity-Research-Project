[project]
name = "edgar"
version = "0.1.0"
description = "Automated SEC filing monitor, ingestion, and analysis pipeline"
requires-python = ">=3.11"
# SPEC-009 Part B (approved 2026-08-25): every dependency below is pinned
# with the compatible-release operator (~=X.Y.Z, PEP 440 -- equivalent to
# >=X.Y.Z,==X.*), not left open-ended, and not exact-pinned either. This
# project has now lost real time to THREE separate unpinned-version
# incidents across three different mechanisms: a bare `streamlit` on PATH
# resolving to an unrelated Anaconda install (decision log #52), a real
# `.venv`'s Streamlit 1.60.0 exposing a `TextColumn(alignment=...)` kwarg
# that 1.51.0 didn't have (decision log #66), and -- found live doing this
# spec's own fresh-environment AC check -- a fresh install independently
# resolving Streamlit 1.62.0 and anthropic 1.0.0 (a MAJOR version), both
# ahead of everything this project has actually been tested against.
# Deployment (Streamlit Cloud) and the scheduled Action (SPEC-009 Part A)
# BOTH install fresh on every run -- an unpinned upper bound means both
# would silently run library versions nothing here has ever executed
# against, on a schedule, unattended.
#
# Compatible-release, not exact (`==`), chosen deliberately: `~=X.Y.Z`
# blocks exactly the two failure SHAPES already experienced here -- a
# minor-version API surface change (1.51 -> 1.60's `alignment` kwarg) and
# a major-version jump (anthropic 0.x -> 1.0) -- while still letting a
# same-minor-version PATCH release (a bug fix, a security fix) reach the
# project without anyone having to notice and hand-bump a version number
# first. An exact pin would need a human to manually re-approve every
# single patch release across every dependency to receive a security fix
# at all, which risks the opposite failure: patches silently never
# applied because nobody is watching. This does NOT pin the full
# transitive dependency tree (pandas/numpy/pyarrow/httpx/... are pulled
# in by streamlit/anthropic themselves, not declared here) -- a complete,
# reproducible lockfile is a real, larger undertaking (pip-tools/uv or
# similar) genuinely out of scope for this fix; noted as a real
# limitation, not silently glossed over.
#
# Versions below are exactly what this project's own `.venv` has actually
# been built and tested against throughout SPEC-001 through this point --
# read from the real, installed environment (`pip show`), not guessed.
# Upgrading any of these is now a DELIBERATE act with its own
# verification (the fresh-clone + fresh-install + full-suite + streamlit
# run check this same spec item just established), never something that
# happens by itself at the next 06:00 scheduled run.
dependencies = [
    # SEC requires custom User-Agent, timeouts, and retry handling on every
    # request; requests gives us that ergonomically. stdlib urllib would work
    # but makes edgar_client.py substantially more verbose for no benefit.
    "requests~=2.34.2",
    # SPEC-002: parsing R-file HTML into clean text and scraping the SEC
    # "Document Format Files" table. html.parser (stdlib) lacks the
    # ergonomic tree/table-navigation API this needs; lxml is an
    # alternative but adds a C-extension build dependency for no real gain
    # here since these documents are not huge.
    "beautifulsoup4~=4.15.0",
    # SPEC-008: the dashboard. Streamlit is the only web framework SPEC-008
    # permits; Plotly is the only charting library, needed for evidence-panel
    # click events (st.plotly_chart(..., on_select=...)) that Streamlit's own
    # native charts don't expose.
    "streamlit~=1.60.0",
    "plotly~=6.9.0",
    # SPEC-006: the real Anthropic client (edgar/llm.py's _RealAnthropicClient,
    # imported lazily so it's only required when an actual API call is made).
    # Found missing from this file entirely on the first real run since the
    # dashboard build -- previously present in whichever environment executed
    # SPEC-006/007's paid runs, but never declared here, so a fresh venv
    # (this one included) had no way to know it was needed until `import
    # anthropic` failed at call time.
    "anthropic~=0.120.2",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.1",
    # SPEC-009 Part A: tests/test_scheduled_workflow.py parses
    # .github/workflows/scheduled-ingestion.yml to check its commands
    # against the real CLI and its binding constraints -- a real dev-only
    # dependency, not an ad hoc one, since the workflow's own "Run test
    # suite" step installs via this same [dev] extra before running pytest.
    "pyyaml~=6.0.3",
]

[tool.setuptools.packages.find]
include = ["edgar*", "dashboard*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
